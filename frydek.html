<style>
:root{--bg:#eef6ea;--card:#fff;--ink:#16301e;--mut:#62806b;--g:#2f9150;--g2:#1d6a3a;--soft:#dcefd5;--line:#d3e4cd;--amb:#f0b448;--cor:#e4755f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#17251c;--ink:#e6f2e6;--mut:#92ad9a;--g:#4fbf74;--g2:#7fd69a;--soft:#1f3527;--line:#2a4333;--on:#0f1a13}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#17251c;--ink:#e6f2e6;--mut:#92ad9a;--g:#4fbf74;--g2:#7fd69a;--soft:#1f3527;--line:#2a4333;--on:#0f1a13}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Nunito,system-ui,sans-serif;min-height:100%;padding-bottom:90px}
[hidden]{display:none!important}button{font:inherit;cursor:pointer;color:inherit}
.app{max-width:560px;margin:0 auto;padding:14px 16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}h1{font-size:28px;color:var(--g2)}h3{font-size:17px;margin-bottom:8px}h2{font-size:19px}
.mut,small{color:var(--mut)}
.hero{display:flex;gap:8px;align-items:flex-end;margin:8px 0 12px}
#buddy{width:96px;flex:none;cursor:pointer;animation:sw 4s ease-in-out infinite;transform-origin:50% 92%}
@keyframes sw{50%{transform:rotate(3deg)}}@media (prefers-reduced-motion:reduce){#buddy{animation:none}}
#say{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 4px;padding:11px 14px;font-weight:700;box-shadow:0 4px 14px #1d6a3a1a;margin-bottom:22px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--g);color:var(--on);border-color:var(--g)}
.in,.title,.body{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 13px;font:inherit}
.row{display:flex;gap:8px;margin:8px 0}.sp{flex:1}
.pill{background:var(--g);color:var(--on);border:0;border-radius:999px;padding:9px 18px;font-weight:800;white-space:nowrap}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:700}
